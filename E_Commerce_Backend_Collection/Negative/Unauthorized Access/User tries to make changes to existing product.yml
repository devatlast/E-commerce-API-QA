info:
  name: User tries to make changes to existing product
  type: http
  seq: 11

http:
  method: PUT
  url: "{{BaseUrl}}/products/1"
  body:
    type: json
    data: "{\r

      \     \"category_id\": 1,\r

      \        \"name\": \"speaker\",\r

      \        \"description\": \"bluetooth speaker for homes\",\r

      \        \"price\": 200,\r

      \        \"stock\": 5\r

      }"
  auth:
    type: bearer
    token: "{{User_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"bad response request\", () => {\r

        \    const badResponse = [401, 403, 404, 500];\r

        \    expect(badResponse).to.include(res.getStatus());\r

        })\r

        \r

        test(\"Cannot edit existing products\", ()=> {\r

        \    expect(res.getBody().code).to.not.eql(200)\r

        \    expect(res.getBody().message).to.eql(\"Admin access required\");\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
