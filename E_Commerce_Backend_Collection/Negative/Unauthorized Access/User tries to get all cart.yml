info:
  name: User tries to get all cart
  type: http
  seq: 13

http:
  method: GET
  url: "{{BaseUrl}}/cart"
  auth:
    type: bearer
    token: "{{User_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        \r

        test(\"Request is not unauthorized\", () => {\r

        \    expect(json.status).to.not.eql(200);\r

        })\r

        \r

        test(\"Admin access required\", () => {\r

        \    expect(json.message).to.eql(\"Admin access required\");\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
