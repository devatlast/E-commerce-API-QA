info:
  name: Unauthorized user trying to access users table
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/users"
  auth:
    type: bearer
    token: "{{User_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        \r

        test(\"Unauthorized request\", () => {\r

        \    expect(json.message).to.eql(\"Admin access required\");\r

        \    expect(res.getStatus()).to.eql(401);\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
