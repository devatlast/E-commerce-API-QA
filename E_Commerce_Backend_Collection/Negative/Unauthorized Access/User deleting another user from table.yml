info:
  name: User deleting another user from table
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{BaseUrl}}/users/4"
  auth:
    type: bearer
    token: "{{User_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Delete request is denied\", ()=>{\r

        \    expect(res.getBody().message).to.eql(\"Admin access required\");\r

        \    expect(res.getStatus()).to.eql(401); \r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
