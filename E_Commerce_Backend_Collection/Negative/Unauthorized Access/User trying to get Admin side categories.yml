info:
  name: User trying to get Admin side categories
  type: http
  seq: 4

http:
  method: GET
  url: "{{BaseUrl}}/category/all"
  auth:
    type: bearer
    token: "{{User_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"request is not successful\", () => {\r

        \    expect(res.getStatus()).to.not.equal(200);\r

        \   \r

        })\r

        test(\"bad response code\", () => {\r

        \    const badResponse = [401, 403, 404, 500];\r

        \    expect(badResponse).to.include(res.getStatus());\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
