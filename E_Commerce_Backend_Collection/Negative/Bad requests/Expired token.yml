info:
  name: Expired token
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseUrl}}/users"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{Admin_Token}}{"

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        test(\"Expired token\", () => {\r

        \    expect(json.message).to.eql(\"Invalid token\")\r

        })\r

        test(\"Response is forbidden\", () => {\r

        \    expect(res.getStatus()).to.equal(403)\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
