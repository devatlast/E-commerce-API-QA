info:
  name: Get all carts
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseUrl}}/cart"
  auth:
    type: bearer
    token: "{{Admin_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Response is not empty\", () => {\r

        \    const response = res.getBody();\r

        \    expect(response).to.not.be.empty;\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Get all carts
    request:
      url: "{{BaseUrl}}/cart"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: X-Powered-By
          value: Express
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "2"
        - name: ETag
          value: W/"2-l9Fw4VUO7kr8CvBlt4zaMCqXZ0w"
        - name: Date
          value: Mon, 10 Aug 2026 08:23:04 GMT
        - name: Connection
          value: keep-alive
        - name: Keep-Alive
          value: timeout=5
      body:
        type: json
        data: "[]"
  - name: Unauthorized
    request:
      url: "{{BaseUrl}}/cart"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: X-Powered-By
          value: Express
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "22"
        - name: ETag
          value: W/"16-gcuJU5q8hXOgf6e20xwF/jTYPwI"
        - name: Date
          value: Mon, 10 Aug 2026 08:24:25 GMT
        - name: Connection
          value: keep-alive
        - name: Keep-Alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
              "message": "No token"
          }
