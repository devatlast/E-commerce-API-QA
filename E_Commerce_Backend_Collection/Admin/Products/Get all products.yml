info:
  name: Get all products
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/products/all"
  auth:
    type: bearer
    token: "{{Admin_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Response has all features\", ()=>{\r

        \    const products = res.getBody();\r

        \    products.forEach(p =>{\r

        \        expect(p).to.have.property(\"id\");\r

        \        expect(p).to.have.property(\"category_id\");\r

        \        expect(p).to.have.property(\"description\");\r

        \        expect(p).to.have.property(\"name\");\r

        \        expect(p).to.have.property(\"price\");\r

        \        expect(p).to.have.property(\"stock\");\r

        \    } )\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
