info:
  name: Get All Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/users"
  auth:
    type: bearer
    token: "{{Admin_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "test( \"All users are returned\", function () {\r

        \    const json = res.getBody();\r

        \    expect(json).to.be.an(\"array\");\r

        });\r

        \r

        test(\"Users have all features\", () => {\r

        \    const users = res.getBody();\r

        \    users.forEach(u => {\r

        \        expect(u).to.have.property(\"id\");\r

        \        expect(u).to.have.property(\"first_name\");\r

        \        expect(u).to.have.property(\"last_name\");\r

        \        expect(u).to.have.property(\"email\");\r

        \        expect(u).to.have.property(\"created_at\");\r

        \        expect(u).to.have.property(\"role\");\r

        \        expect(u).to.have.property(\"password\");\r

        \    });\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
