info:
  name: Get order by Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseUrl}}/orders/8"
  auth:
    type: bearer
    token: "{{Admin_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 200\", ()=>{\r

        \    const badResponse = [404, 500, 401];\r

        \    const responseCode = res.getStatus();\r

        \    expect(responseCode).to.not.be.oneOf(badResponse)\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
