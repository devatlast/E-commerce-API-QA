info:
  name: Create new category
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseUrl}}/category"
  body:
    type: json
    data: "{\r

      \    \"name\": \"Men's clothing\"\r

      }"
  auth:
    type: bearer
    token: "{{Admin_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "const json = res.getBody();\r

        if(json.id){\r

        \tbru.setEnvVar(\"category_to_work_with\", json.id)\r

        }\r

        \r

        test(\"status code is 201\", () => {\r

        \texpect(res.getStatus()).to.equal(201);\r

        })\r

        \r

        test(\"Response should be under 800ms\", () => {\r

        \    expect(res.getResponseTime()).to.be.below(800);\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
