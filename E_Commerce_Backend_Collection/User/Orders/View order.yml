info:
  name: View order
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseUrl}}/orders/me"
  auth:
    type: bearer
    token: "{{User_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Order exist\", () => {\r

        \    const json = res.getBody();\r

        \    expect(json.length).to.be.above(0);\r

        \    json.forEach(o => {\r

        \        expect(o).to.have.property(\"total\");\r

        \        expect(o).to.have.property(\"status\");\r

        \    })\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
