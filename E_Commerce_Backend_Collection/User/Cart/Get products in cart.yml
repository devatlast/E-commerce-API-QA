info:
  name: Get products in cart
  type: http
  seq: 3

http:
  method: GET
  url: "{{BaseUrl}}/cart/me"
  body:
    type: text
    data: ""
  auth:
    type: bearer
    token: "{{User_Token}}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Cart items should be returned\", () => {\r

        \    expect(res.getBody().length).to.be.above(0);\r

        });\r

        \r

        test(\"Response does not have exposed features\", () => {\r

        \    const cart = res.getBody();\r

        \    cart.forEach(c => {\r

        \        expect(c).to.not.have.property('id');\r

        \        expect(c).to.not.have.property('created_at');\r

        \        expect(c).to.have.property(\"full_name\");\r

        \        expect(c).to.have.property(\"quantity\");\r

        \        expect(c).to.have.property(\"product_name\");\r

        \        expect(c).to.have.property(\"price\");\r

        \    })\r

        })"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
